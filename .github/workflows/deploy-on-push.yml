name: Deploy en Push a main

on:
  push:
    branches:
      - main

# Si llegan varios pushes seguidos, cancela el deploy anterior y
# solo ejecuta el más reciente. Evita que los commits del batch
# de portadas amontonen decenas de deploys simultáneos.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js v20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias (sin ejecutar scripts de noticias)
      - name: Install Dependencies
        run: npm ci

      # 4. Compilar el proyecto (SOLO vite build — sin update_news.cjs)
      #    No se llama a Groq, no se generan noticias nuevas.
      - name: Build Project
        run: npx vite build

      # 5. Desplegar dist/ a SiteGround vía FTP
      #    Mismas exclusiones que el workflow de noticias para no borrar
      #    archivos críticos del servidor (SSL, uploads de juegos, etc.)
      - name: Deploy to SiteGround via Node FTP
        run: node scripts/deploy_ftp.cjs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

